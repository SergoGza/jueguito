<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liber Vagatorum · juego 2D</title>
  <meta name="description" content="Liber Vagatorum: prototipo de videojuego con moñigotes, con el mismo motor que el juguete.">
  <meta name="theme-color" content="#2b2118">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

<body>
  <!-- el día: el HUD arriba, la escena (Phaser) y encima los menús, el resultado y el mapa -->

    <div id="hud"></div>
    <div id="marco"><div id="lienzo"></div><div id="capa"></div></div>

  <noscript>Este juego necesita JavaScript.</noscript>

  <script src="engine.js"></script>
  <script src="juego-mapa.js"></script>
  <script src="juego.js"></script>
